name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m py_compile main.py start.py tests/test_helpers.py
      - name: Run regression tests
        env:
          BOT_TOKEN: '123456:TEST_TOKEN_FOR_AUTOMATED_TESTS'
          DB_PATH: '/tmp/heradelegend-ci.sqlite3'
        run: python -m pytest -q
